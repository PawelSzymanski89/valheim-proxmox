# Valheim server + panel in one container.
#
#   cp .env.example .env      # ports, names, passwords - edit what you like
#   docker compose up -d      # first start downloads ~1.5 GB from Steam, give it a few minutes
#
# Then the panel is on http://HOST:${PANEL_PORT} (login from .env, the panel nags until
# the password is changed) and the game on HOST:${GAME_PORT}/udp. The world, backups,
# mods and every setting live in the `valheim` volume - rebuild or pull the image freely.
#
# host networking: the game takes GAME_PORT and GAME_PORT+1 (udp), the panel PANEL_PORT
# (tcp), straight on the host - one variable sets the port inside and outside, and the
# panel can change the game port later without a compose edit. No NAT in the UDP path.
services:
  valheim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: valheim-proxmox:latest
    container_name: ${CONTAINER_NAME:-valheim}
    hostname: ${CONTAINER_NAME:-valheim}
    network_mode: host
    # systemd is PID 1 inside: it needs the cgroup tree and the usual tmpfs mounts.
    # `privileged` is the short spelling of that; the game itself asks for nothing special.
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - valheim:/opt/valheim
    env_file:
      - path: .env
        required: false
    stop_signal: SIGRTMIN+3
    stop_grace_period: 100s        # the game saves the world on SIGINT; give it time
    restart: unless-stopped

volumes:
  valheim:
    name: ${CONTAINER_NAME:-valheim}
