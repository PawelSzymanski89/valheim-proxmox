<script>
// Obie wersje siedzą w atrybutach elementów, więc nie ma dwóch kopii strony do
// utrzymania ani przeskoku treści przy przełączeniu. Wybór pamiętany, a domyślny
// bierze się z języka przeglądarki — Polak trafia na polski, reszta świata na
// angielski, bez klikania.
function setLang(lang){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-pl]').forEach(el => {
    const v = el.dataset[lang];
    if (v !== undefined) el.innerHTML = v;
  });
  document.getElementById('b-pl').setAttribute('aria-pressed', lang === 'pl');
  document.getElementById('b-en').setAttribute('aria-pressed', lang === 'en');
  try { localStorage.setItem('vp_lang', lang); } catch (e) {}
}
setLang((() => {
  try { const s = localStorage.getItem('vp_lang'); if (s) return s; } catch (e) {}
  return (navigator.language || 'en').toLowerCase().startsWith('pl') ? 'pl' : 'en';
})());
</script>
